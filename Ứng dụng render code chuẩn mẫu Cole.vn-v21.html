<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Code Generator Pro</title>
    
    <!-- Tailwind CSS for Application UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Marked.js for Markdown to HTML conversion -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js for Code Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Turndown.js for HTML to Markdown conversion (Hỗ trợ copy từ Word/Docs) -->
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <script src="https://unpkg.com/turndown-plugin-gfm/dist/turndown-plugin-gfm.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS cho UI của ứng dụng */
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #2563eb; }
        .tab-inactive { color: #6b7280; }
        .tab-inactive:hover { color: #374151; }
        
        /* Hiệu ứng Toast thông báo */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #10B981;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        /* Toolbar Styles */
        .toolbar-btn {
            padding: 6px 10px;
            color: #4b5563;
            border-radius: 4px;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .toolbar-btn:hover {
            background-color: #e5e7eb;
            color: #1f2937;
        }
        .toolbar-divider {
            width: 1px;
            height: 24px;
            background-color: #d1d5db;
            margin: 0 8px;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0">

                <i class="fa-solid fa-code"></i>
            </div>

        </div>

            <i class="fa-solid fa-wand-magic-sparkles"></i> Render Code

    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">

                    <i class="fa-solid fa-bold"></i>
                </button>
                <button class="toolbar-btn" onclick="insertMarkdown('*', '*')" title="In nghiêng (Ctrl+I)">
                    <i class="fa-solid fa-italic"></i>
                </button>
                <button class="toolbar-btn" onclick="insertMarkdown('<u>', '</u>')" title="Gạch chân (Ctrl+U)">
                    <i class="fa-solid fa-underline"></i>
                </button>
                <button class="toolbar-btn" onclick="insertMarkdown('~~', '~~')" title="Gạch ngang chữ">
                    <i class="fa-solid fa-strikethrough"></i>
                </button>
                
                <div class="toolbar-divider"></div>

                <button class="toolbar-btn" onclick="insertHeader(2)" title="Tiêu đề H2">
                    <span class="font-bold">H2</span>
                </button>
                <button class="toolbar-btn" onclick="insertHeader(3)" title="Tiêu đề H3">
                    <span class="font-bold">H3</span>
                </button>

                <div class="toolbar-divider"></div>

                <button class="toolbar-btn" onclick="insertList('- ')" title="Danh sách chấm tròn">
                    <i class="fa-solid fa-list-ul"></i>
                </button>
                <button class="toolbar-btn" onclick="insertList('1. ')" title="Danh sách số">
                    <i class="fa-solid fa-list-ol"></i>
                </button>
                <button class="toolbar-btn" onclick="insertMarkdown('> ', '')" title="Trích dẫn (Quote)">
                    <i class="fa-solid fa-quote-right"></i>
                </button>

                <div class="toolbar-divider"></div>

                <button class="toolbar-btn" onclick="insertLink()" title="Chèn Link">
                    <i class="fa-solid fa-link"></i>
                </button>
                <button class="toolbar-btn" onclick="insertImage()" title="Chèn Ảnh">
                    <i class="fa-regular fa-image"></i>
                </button>
                <button class="toolbar-btn" onclick="insertTable()" title="Chèn Bảng">
                    <i class="fa-solid fa-table"></i>
                </button>

                <div class="toolbar-divider"></div>

                <button class="toolbar-btn bg-gray-800 text-white hover:bg-gray-700" onclick="insertCodeBlock()" title="Định dạng thành Khối Code (VS Code style)">

            </div>

        </div>

            </div>
        </div>
    </main>

        // Cấu hình bộ dịch Marked.js tiêu chuẩn có tích hợp Highlight.js để tô màu Code
        marked.setOptions({
            breaks: true, // Cho phép xuống dòng bằng Enter
            gfm: true,    // Hỗ trợ Github Flavored Markdown (Bảng, danh sách, code...)
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                // Nếu không chỉ định ngôn ngữ, tự động nhận diện ngôn ngữ để tô màu
                return hljs.highlightAuto(code).value;
            }
        });

        // DOM Elements
        const markdownInput = document.getElementById('markdownInput');
        const previewContainer = document.getElementById('previewContainer');
        const htmlOutput = document.getElementById('htmlOutput');
        const renderBtn = document.getElementById('renderBtn');
        const tabPreviewBtn = document.getElementById('tabPreviewBtn');

        const toast = document.getElementById('toast');

        // === TOOLBAR FUNCTIONS ===
        function insertMarkdown(prefix, suffix) {
            const start = markdownInput.selectionStart;
            const end = markdownInput.selectionEnd;
            const text = markdownInput.value;
            const selectedText = text.substring(start, end);
            
            markdownInput.value = text.substring(0, start) + prefix + selectedText + suffix + text.substring(end);
            markdownInput.focus();
            
            if (selectedText.length > 0) {
                markdownInput.setSelectionRange(start, end + prefix.length + suffix.length);
            } else {
                markdownInput.setSelectionRange(start + prefix.length, start + prefix.length);
            }
            processContent();
        }

        function insertHeader(level) {
            const prefix = '#'.repeat(level) + ' ';
            insertMarkdown(prefix, '');
        }

        function insertList(prefix) {
            const start = markdownInput.selectionStart;
            const end = markdownInput.selectionEnd;
            const text = markdownInput.value;
            const selectedText = text.substring(start, end);

            if (selectedText.length > 0) {
                // Apply list prefix to each selected line
                const lines = selectedText.split('\n');
                const listText = lines.map(line => prefix + line).join('\n');
                markdownInput.value = text.substring(0, start) + listText + text.substring(end);
                markdownInput.setSelectionRange(start, start + listText.length);
            } else {
                insertMarkdown(prefix, '');
            }
            processContent();
        }

        function insertLink() {
            const url = prompt("Nhập địa chỉ liên kết (URL):", "https://");
            if (url) {
                insertMarkdown('[', `](${url})`);
            }
        }

        function insertImage() {
            const url = prompt("Nhập đường dẫn ảnh (URL):", "https://");
            if (url) {
                const alt = prompt("Nhập mô tả ảnh (Alt text):", "Mô tả ảnh");
                const imageMarkdown = `![${alt}](${url})`;
                insertMarkdown(imageMarkdown, '');
            }
        }

        function insertTable() {
            const tableTemplate = `\n| Tiêu đề 1 | Tiêu đề 2 | Tiêu đề 3 |\n| :--- | :--- | :--- |\n| Cột 1 | Cột 2 | Cột 3 |\n| Cột 1 | Cột 2 | Cột 3 |\n`;
            insertMarkdown(tableTemplate, '');
        }

        function insertCodeBlock() {
            const start = markdownInput.selectionStart;
            const end = markdownInput.selectionEnd;
            const selectedText = markdownInput.value.substring(start, end);
            
            if (selectedText.includes('\n') || selectedText.length > 30) {
                // Block code (nhiều dòng) -> Auto format thành python mặc định (hoặc người dùng có thể đổi)
                insertMarkdown('\n```python\n', '\n```\n');
            } else {
                // Inline code (đoạn ngắn)
                insertMarkdown('`', '`');
            }
        }

        // Bắt phím tắt (Ctrl+B, Ctrl+I...)
        markdownInput.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key.toLowerCase()) {
                    case 'b': e.preventDefault(); insertMarkdown('**', '**'); break;
                    case 'i': e.preventDefault(); insertMarkdown('*', '*'); break;
                    case 'u': e.preventDefault(); insertMarkdown('<u>', '</u>'); break;
                }
            }
        });

        // === KHỞI TẠO TURNDOWN (XỬ LÝ DÁN TỪ WORD/DOCS) ===
        const turndownService = new TurndownService({
            headingStyle: 'atx',
            codeBlockStyle: 'fenced',
            bulletListMarker: '-' // Ưu tiên dùng dấu gạch ngang (-) cho danh sách trong khung soạn thảo Markdown
        });
        
        // Kích hoạt plugin GFM (để hỗ trợ copy Bảng biểu, Checkbox...)
        if (typeof turndownPluginGfm !== 'undefined') {
            const gfm = turndownPluginGfm.gfm;
            turndownService.use(gfm);
        }

        function cleanHTMLBeforeTurndown(html) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;

            // Xóa các thẻ rác, colgroup, metadata ẩn của Google Docs
            tempDiv.querySelectorAll('colgroup, col, meta, style, script').forEach(el => el.remove());

            // --- KHẮC PHỤC LỖI VỠ BẢNG TỪ GOOGLE DOCS ---
            // Gỡ bỏ thẻ <p> bên trong các ô của bảng. 
            tempDiv.querySelectorAll('th, td').forEach(cell => {
                // Bóc tách thẻ <p>, chỉ giữ lại ruột bên trong
                cell.querySelectorAll('p').forEach(p => {
                    const fragment = document.createDocumentFragment();
                    while (p.firstChild) {
                        fragment.appendChild(p.firstChild);
                    }
                    p.parentNode.replaceChild(fragment, p);
                });
                // Xóa mọi dấu Enter (xuống dòng) và khoảng trắng thừa bên trong ô
                cell.innerHTML = cell.innerHTML.replace(/(\r\n|\n|\r)/gm, " ").replace(/\s+/g, " ").trim();
            });

            // Xử lý Bảng từ Google Docs/Word (Ép tạo thead để Turndown hiểu là Markdown Table)
            tempDiv.querySelectorAll('table').forEach(table => {
                const rows = table.querySelectorAll('tr');
                if (rows.length > 0 && !table.querySelector('thead')) {
                    const thead = document.createElement('thead');
                    const firstRow = rows[0];
                    
                    const cells = firstRow.querySelectorAll('td, th');
                    const newRow = document.createElement('tr');
                    cells.forEach(cell => {
                        const th = document.createElement('th');
                        th.innerHTML = cell.innerHTML;
                        newRow.appendChild(th);
                    });
                    
                    thead.appendChild(newRow);
                    table.insertBefore(thead, table.firstChild);
                    firstRow.remove();
                }
            });

            // Xử lý thẻ b bọc ngoài cùng bị dư thừa của Google Docs
            const docsWrappers = tempDiv.querySelectorAll('b[id^="docs-internal-guid"]');
            docsWrappers.forEach(b => {
                if (b.style.fontWeight === 'normal') {
                    const fragment = document.createDocumentFragment();
                    while(b.firstChild) {
                        fragment.appendChild(b.firstChild);
                    }
                    b.parentNode.replaceChild(fragment, b);
                }
            });

            // Chuyển đổi các thẻ span chứa định dạng (bold, italic) của Docs sang thẻ chuẩn (strong, em)
            const spans = tempDiv.querySelectorAll('span');
            spans.forEach(span => {
                // Ép xóa các định dạng font-family rác từ Word/Docs
                span.style.fontFamily = ''; 

                let isBold = span.style.fontWeight === '700' || span.style.fontWeight === 'bold' || parseInt(span.style.fontWeight) >= 600;
                let isItalic = span.style.fontStyle === 'italic';
                
                if (isBold || isItalic) {
                    let inner = span.innerHTML;
                    if (isBold) inner = `<strong>${inner}</strong>`;
                    if (isItalic) inner = `<em>${inner}</em>`;
                    span.innerHTML = inner;
                }
            });

            return tempDiv.innerHTML;
        }

        // Bắt sự kiện Dán (Paste) để tự động dịch HTML sang Markdown
        markdownInput.addEventListener('paste', function(e) {
            // Lấy HTML từ Clipboard
            const html = (e.clipboardData || window.clipboardData).getData('text/html');
            
            if (html) {
                e.preventDefault(); // Ngăn dán văn bản thuần
                
                // Làm sạch HTML của Docs và chuyển thành Markdown
                const cleanedHTML = cleanHTMLBeforeTurndown(html);
                const markdown = turndownService.turndown(cleanedHTML);
                
                // Chèn markdown vào vị trí con trỏ
                const start = this.selectionStart;
                const end = this.selectionEnd;
                const text = this.value;
                this.value = text.substring(0, start) + markdown + text.substring(end);
                
                // Cập nhật vị trí con trỏ
                this.selectionStart = this.selectionEnd = start + markdown.length;
                
                // Tự động Render
                processContent();
                showToast("Đã tự động chuyển đổi định dạng từ Clipboard!", "#3b82f6");
            }
        });

        // Hàm xử lý Render Code
        function processContent() {
            const rawMarkdown = markdownInput.value;
            
            if(!rawMarkdown.trim()) {
                showToast("Vui lòng nhập nội dung!", "#EF4444");
                return;
            }

            // Dịch Markdown sang HTML thô
            let rawHtml = marked.parse(rawMarkdown);

            // --- XỬ LÝ HTML BẰNG DOM (ROBUST) ĐỂ THÊM TARGET=_BLANK VÀ FIGURE ---
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawHtml;

            // 1. Ép tất cả link (TRỪ LINK CỦA MỤC LỤC SẮP TẠO) mở trong Tab mới
            // VÀ Tự động nhúng Video YouTube
            tempDiv.querySelectorAll('a').forEach(a => {
                const url = a.href;
                // Regex tìm Video ID của YouTube (hoạt động với youtube.com và youtu.be)
                const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
                const match = url.match(ytRegex);

                const isNakedLink = a.textContent.trim() === url.trim() || a.textContent.trim() === url.replace(/^https?:\/\//, '').trim();
                const isOnlyChildOfP = a.parentElement && a.parentElement.tagName.toLowerCase() === 'p' && a.parentElement.textContent.trim() === a.textContent.trim();

                // Nhúng video nếu là link đứng một mình trên 1 dòng hoặc là link trần
                if (match && (isOnlyChildOfP || isNakedLink)) {
                    const videoId = match[1];
                    const iframeHtml = `
                        <div class="video-responsive">
                            <iframe src="https://www.youtube.com/embed/${videoId}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    `;
                    const wrapper = document.createElement('div');
                    wrapper.innerHTML = iframeHtml.trim();
                    const videoEl = wrapper.firstChild;

                    // Thay thế an toàn
                    if (isOnlyChildOfP) {
                        a.parentElement.parentNode.replaceChild(videoEl, a.parentElement);
                    } else {
                        a.parentNode.replaceChild(videoEl, a);
                    }
                } else {
                    // Nếu là link bình thường thì ép mở tab mới
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                }
            });

            // 2. Bọc thẻ <figure>, thêm loading="lazy" và chèn figcaption từ thuộc tính alt
            tempDiv.querySelectorAll('img').forEach(img => {
                img.setAttribute('loading', 'lazy');
                
                // Lấy nội dung alt text
                const altText = img.getAttribute('alt');

                let figureElement = img.closest('figure');

                // Khắc phục việc thẻ <p> bọc ảnh mặc định của Markdown
                if (img.parentElement && img.parentElement.tagName.toLowerCase() === 'p') {
                    const p = img.parentElement;
                    const figure = document.createElement('figure');
                    figure.innerHTML = p.innerHTML; // Lấy img ra khỏi p
                    p.parentNode.replaceChild(figure, p);
                    figureElement = figure;
                    // Lấy lại tham chiếu đến thẻ img mới bên trong figure
                    img = figure.querySelector('img');
                } else if (!figureElement) {
                    const figure = document.createElement('figure');
                    img.parentNode.insertBefore(figure, img);
                    figure.appendChild(img);
                    figureElement = figure;
                }

                // Nếu có alt text, tạo thẻ figcaption và chèn vào cuối thẻ figure
                if (altText && altText.trim() !== '') {
                    // Kiểm tra xem đã có figcaption chưa (tránh chèn trùng lặp nếu chạy lại)
                    if (!figureElement.querySelector('figcaption')) {
                        const figcaption = document.createElement('figcaption');
                        figcaption.textContent = altText;
                        figureElement.appendChild(figcaption);
                    }
                }
            });

            // 3. Bọc thẻ div cho Table để xử lý thanh cuộn ngang (Responsive trên Mobile)
            tempDiv.querySelectorAll('table').forEach(table => {
                if (!table.parentElement.classList.contains('table-responsive')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'table-responsive';
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                }
            });

            // Gỡ bỏ tính năng tự động tạo mục lục (Auto TOC) theo yêu cầu
            // Nếu người dùng lỡ copy dính mục lục từ nguồn khác, có thể tự động xóa đi (tùy chọn)
            tempDiv.querySelectorAll('.toc').forEach(el => el.remove());

            rawHtml = tempDiv.innerHTML;

            const finalHTML = `
<!-- BẮT ĐẦU ĐOẠN CODE BÀI VIẾT -->
${userCSS}

<div class="blog-container">
${rawHtml}
</div>
<!-- KẾT THÚC ĐOẠN CODE BÀI VIẾT -->
`;
            
            // Cập nhật vùng Preview (Chỉ đẩy HTML vào, trình duyệt sẽ tự đọc tag <style>)
            previewContainer.innerHTML = finalHTML;
            
            // Cập nhật vùng Code Export
            htmlOutput.value = finalHTML.trim();
        }

        // Sự kiện nút Render
        renderBtn.addEventListener('click', processContent);

        // Chuyển đổi Tabs
        tabPreviewBtn.addEventListener('click', () => {
            tabPreviewBtn.className = "px-4 py-3 text-sm font-semibold tab-active transition-colors flex items-center gap-2";
            tabCodeBtn.className = "px-4 py-3 text-sm font-semibold tab-inactive transition-colors flex items-center gap-2";
            previewArea.classList.remove('hidden');
            codeArea.classList.add('hidden');
        });

        tabCodeBtn.addEventListener('click', () => {
            tabCodeBtn.className = "px-4 py-3 text-sm font-semibold tab-active transition-colors flex items-center gap-2";
            tabPreviewBtn.className = "px-4 py-3 text-sm font-semibold tab-inactive transition-colors flex items-center gap-2";
            codeArea.classList.remove('hidden');
            previewArea.classList.add('hidden');
        });

        // Hàm Xóa nội dung
        function clearEditor() {
            markdownInput.value = '';
            previewContainer.innerHTML = '';
            htmlOutput.value = '';
        }

        function copyCode() {
            htmlOutput.select();
            htmlOutput.setSelectionRange(0, 99999);
            document.execCommand("copy");
            showToast("Đã copy Code HTML!", "#3b82f6");
            window.getSelection().removeAllRanges();
        }

        // Cấu hình Toast
        function showToast(message, bgColor) {
            toast.innerHTML = message;
            toast.style.backgroundColor = bgColor;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }
